services:
  spines1:
    image: spines-img
    container_name: sender
    cap_add: [NET_ADMIN]
    command: sleep infinity
    networks:
      spines-net:
        ipv4_address: 172.20.0.2
  spines2:
    image: spines-img
    container_name: receiver
    cap_add: [NET_ADMIN]
    command: sleep infinity
    networks:
      spines-net:
        ipv4_address: 172.20.0.3
networks:
  spines-net:
    name: spines-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
